# .github/release.yml

name: release
on:
  push:
    branches:
      - master

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: yarn

      # gel

      - name: Copy readme
        run: cp README.md packages/gel/README.md

      - name: Build gel
        run: yarn workspace gel run build

      - name: Check if 'gel' needs publishing
        id: check_gel
        working-directory: packages/gel
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "Checking if ${NAME}@${VERSION} is published..."
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "Version ${VERSION} already published on npm. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${VERSION} is not published. Staging release."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            if echo "$VERSION" | grep -q '-'; then
              TAG=$(echo "$VERSION" | sed -E 's/.*-([^\.]+).*/\1/')
            else
              TAG="latest"
            fi
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Stage 'gel' to npm
        if: steps.check_gel.outputs.skip == 'false'
        working-directory: packages/gel
        run: npm stage publish --access public --tag "${{ steps.check_gel.outputs.tag }}"

      - name: Create 'gel' Release
        if: steps.check_gel.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.check_gel.outputs.version }}
          name: "gel-js v${{ steps.check_gel.outputs.version }}"
          draft: true
          prerelease: ${{ steps.check_gel.outputs.tag != 'latest' }}

