# .github/release.edgedb.yml

name: release edgedb
on:
  push:
    branches:
      - master

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install deps
        run: yarn

      - name: Build all packages
        run: yarn build

      # edgedb

      - name: Check if 'edgedb' needs publishing
        id: check_edgedb
        working-directory: edgedb/edgedb
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "Checking if ${NAME}@${VERSION} is published..."
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "Version ${VERSION} already published on npm. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${VERSION} is not published. Staging release."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            if echo "$VERSION" | grep -q '-'; then
              TAG=$(echo "$VERSION" | sed -E 's/.*-([^\.]+).*/\1/')
            else
              TAG="latest"
            fi
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Stage 'edgedb' to npm
        if: steps.check_edgedb.outputs.skip == 'false'
        working-directory: edgedb/edgedb
        run: npm stage publish --access public --tag "${{ steps.check_edgedb.outputs.tag }}"

      - name: Create 'edgedb' Release
        if: steps.check_edgedb.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.check_edgedb.outputs.version }}
          name: "edgedb-js v${{ steps.check_edgedb.outputs.version }}"
          draft: true
          prerelease: ${{ steps.check_edgedb.outputs.tag != 'latest' }}

      # @edgedb/generate

